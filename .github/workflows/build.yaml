name: Build OpenCentauri FW

on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FW_VER: 1.4.49
  OC_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
  OC_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  OC_BUILD_DIRTY: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt install -y bsdiff
      
      - name: Download firmware
        run: |
          ./fwdl.sh $FW_VER
      
      - name: build patched firmware
        run: |
          rm ./oc-patches/patch_config
          cp ./firmware-editions/patched ./oc-patches/patch_config
          ./build.sh $FW_VER
          final_swu_path="$(python3 -c 'import json; print(json.load(open("update/manifest.json"))["final_firmware"]["path"])')"
          cp "$final_swu_path" "$(basename "$final_swu_path")"
          cp ./update/manifest.json manifest.json
          cp ./update/patches.md patches.md

      # TODO: Re-enable klipper-pi build once KIP_BOOTSTRAP_URL is configured
      # - name: build klipper-pi firmware
      #   run: |
      #     rm ./oc-patches/patch_config
      #     cp ./firmware-editions/klipper-pi ./oc-patches/patch_config
      #     ./build.sh $FW_VER
      #     cp ./update/update.swu klipper-pi.swu
      
      - id: upload_firmware
        uses: actions/upload-artifact@v4
        with:
          name: CC1 Firmware
          path: |
            update-*.swu
            manifest.json
            patches.md
            # klipper-pi.swu

      - name: Post patch summary to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- opencentauri-patch-summary -->';
            const summary = fs.readFileSync('patches.md', 'utf8');
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const artifactId = process.env.ARTIFACT_ID;
            const artifactUrl = artifactId
              ? `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifactId}`
              : `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts`;
            const nightlyUrl = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/CC1%20Firmware.zip`;
            const body = `${marker}
            ## PR build artifact

            - [Download the CC1 Firmware](${nightlyUrl})
            - Flash this exact build from an OpenCentauri patched printer running v0.4.0 or later:
              \`\`\`sh
              flash-artifact ${nightlyUrl}
              \`\`\`
            - Artifact details (GitHub login required): <${artifactUrl}>

            ## Firmware patches included

            ${summary}

            Please provide feedback as comments in this PR or in the \`#patched-fw\` channel on Discord.`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
        env:
          ARTIFACT_ID: ${{ steps.upload_firmware.outputs.artifact-id }}
