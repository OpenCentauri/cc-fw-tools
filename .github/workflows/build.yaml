name: Build OpenCentauri FW

on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 1.4.46

env:
  FW_VER: 1.4.46

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt install -y bsdiff
      
      - name: Download firmware
        run: |
          ./fwdl.sh $FW_VER
      
      - name: build patched firmware
        run: |
          rm ./oc-patches/patch_config
          cp ./firmware-editions/patched ./oc-patches/patch_config
          ./build.sh $FW_VER
          cp ./update/update.swu update.swu

      # TODO: Re-enable klipper-pi build once KIP_BOOTSTRAP_URL is configured
      # - name: build klipper-pi firmware
      #   run: |
      #     rm ./oc-patches/patch_config
      #     cp ./firmware-editions/klipper-pi ./oc-patches/patch_config
      #     ./build.sh $FW_VER
      #     cp ./update/update.swu klipper-pi.swu
      
      - uses: actions/upload-artifact@v4
        with:
          name: CC1 Firmware
          path: |
            update.swu
            # klipper-pi.swu

  beta-release:
    name: Update Beta Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/1.4.46'
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: CC1 Firmware
          path: .

      - name: Update 0.0.0 beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the 0.0.0 release if it doesn't exist; ignore error if it does
          gh release create 0.0.0 \
            --title "Beta (0.0.0)" \
            --notes "Latest beta build from 1.4.46 branch — commit ${{ github.sha }}" \
            --prerelease || true
          
          # Upload (or overwrite) update.swu to the 0.0.0 release
          gh release upload 0.0.0 update.swu --clobber
