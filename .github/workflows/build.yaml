name: Build OpenCentauri FW

on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FW_VER: 1.4.46

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt install -y bsdiff
      
      - name: Download firmware
        run: |
          ./fwdl.sh $FW_VER
      
      - name: build patched firmware
        run: |
          rm ./oc-patches/patch_config
          cp ./firmware-editions/patched ./oc-patches/patch_config
          ./build.sh $FW_VER
          cp ./update/update.swu update.swu
          cp ./update/manifest.json manifest.json
          cp ./update/patches.md patches.md

      # TODO: Re-enable klipper-pi build once KIP_BOOTSTRAP_URL is configured
      # - name: build klipper-pi firmware
      #   run: |
      #     rm ./oc-patches/patch_config
      #     cp ./firmware-editions/klipper-pi ./oc-patches/patch_config
      #     ./build.sh $FW_VER
      #     cp ./update/update.swu klipper-pi.swu
      
      - uses: actions/upload-artifact@v4
        with:
          name: CC1 Firmware
          path: |
            update.swu
            manifest.json
            patches.md
            # klipper-pi.swu

      - name: Post patch summary to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- opencentauri-patch-summary -->';
            const summary = fs.readFileSync('patches.md', 'utf8');
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
