name: Promote to Beta Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID to promote (from Actions > Build OpenCentauri FW)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: Promote Build to Beta
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: CC1 Firmware
          path: .
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update v0.0.0 beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="v0.0.0"
          TITLE="${VERSION} - beta pre-release, do not install unless instructed"
          NOTES=$(cat <<EOF
          Latest beta build from run ${{ github.event.inputs.run_id }} — commit ${{ github.sha }}

          $(cat patches.md)
          EOF
          )

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} exists; updating target, title, and notes."
            gh release edit "${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --prerelease
          else
            echo "Creating release ${VERSION}."
            gh release create "${VERSION}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --prerelease
          fi

          # Upload (or overwrite) the firmware, provenance manifest, and patch summary
          gh release upload "${VERSION}" update.swu manifest.json patches.md --clobber
